<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serapheim — My First Deploy</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --text: #e8eaf0;
      --muted: #9aa0b4;
      --accent: #6c7cff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .badge {
      display: inline-block;
      font-size: 13px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(108,124,255,0.12);
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 24px;
    }
    h1 { font-size: 32px; line-height: 1.2; margin-bottom: 14px; }
    p { color: var(--muted); font-size: 16px; line-height: 1.6; margin-bottom: 10px; }
    .count {
      margin-top: 28px;
      font-size: 15px;
      color: var(--text);
    }
    button {
      margin-top: 8px;
      font: inherit;
      font-size: 15px;
      color: var(--text);
      background: var(--accent);
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.08s ease, opacity 0.2s ease;
    }
    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.97); }
    .foot { margin-top: 32px; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Live on Vercel</span>
    <h1>Hey, I'm Serapheim 👋</h1>
    <p>This is my first page deployed through GitHub and Vercel.</p>
    <p>If you can read this, the whole pipeline works.</p>
    <div class="count">
      <p>You've clicked the button <strong id="n">0</strong> times.</p>
      <button id="btn">Click me</button>
    </div>
    <div class="foot">Edit this file, push to GitHub, and watch it redeploy automatically.</div>
  </main>
  <script>
    let n = 0;
    const out = document.getElementById('n');
    document.getElementById('btn').addEventListener('click', () => {
      n++;
      out.textContent = n;
    });
  </script>
</body>
</html>
